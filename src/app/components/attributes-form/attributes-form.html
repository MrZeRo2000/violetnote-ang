<div class="header-row">
  <button mat-icon-button color="accent" (click)="onAddClick()">
    <mat-icon aria-label="Add">add</mat-icon>
  </button>
  <mat-label>Attributes</mat-label>
</div>
<div class="editor" [formGroup]="form">
  @for (attribute of attributes.controls; track trackByIndex($index); let i = $index) {
    <div class="row" [formGroup]="attribute">
      <mat-form-field class="item" subscriptSizing="dynamic">
        <input #nameInput matInput type="text" placeholder="Name" formControlName="name" (blur)="markAsTouched()">
      </mat-form-field>

      <mat-form-field class="item" subscriptSizing="dynamic">
        <input matInput type="text"  placeholder="Value" formControlName="value" (blur)="markAsTouched()">
      </mat-form-field>

      <div class="action">
        <button
          mat-icon-button
          type="button"
          color="warn"
          (click)="onDeleteClick(i)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
  }
</div>
